[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domestica"
version = "0.1.0"
description = "A tool to optimize DNA sequences for synthesis."
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.80",
    "dnachisel>=3.0.0",
    "httpx>=0.24.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0"
]

[project.scripts]
domestica = "domestica.cli:app"

[tool.setuptools.packages.find]
where = ["src"]