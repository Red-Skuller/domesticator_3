[tox]
envlist = py39, py310, py311, lint
isolated_build = True

[testenv]
description = Run the unit tests.
deps =
    pytest
commands =
    pytest tests/

[testenv:lint]
description = Run the code analysis tools.
deps =
    black
    flake8
    mypy
commands =
    black --check src/
    flake8 src/
    mypy src/